services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command:
      - --storageEngine=wiredTiger
      - --wiredTigerCacheSizeGB
      - "0.25"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    mem_limit: 600m
    # No published ports — app reaches mongo on the compose network only.

  app:
    image: ${PORTFOLIO_IMAGE:-portfolio:latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mongo
    mem_limit: 900m

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  # Outbound connector for sinaoshaghi.com (D-036). Host network → 127.0.0.1:3000 (D-029).
  # Token via .env.cloudflared (TUNNEL_TOKEN=…) — env_file values are not Compose-interpolated,
  # so `$` inside the JWT is safe. Profile `tunnel` so bare `compose up -d` skips it.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    network_mode: host
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    env_file:
      - path: .env.cloudflared
        required: true
    depends_on:
      - app

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
