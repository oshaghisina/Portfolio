services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command:
      - --storageEngine=wiredTiger
      - --wiredTigerCacheSizeGB
      - "0.25"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    mem_limit: 600m
    # No published ports — app reaches mongo on the compose network only.

  app:
    image: ${PORTFOLIO_IMAGE:-portfolio:latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mongo
    mem_limit: 900m

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
