name: Image

# Builds the production image from the Dockerfile and pushes it to GHCR; Coolify on the VPS pulls
# it (the 1 vCPU / 2 GB box cannot build Next itself). `next build` still starts Payload, so it gets
# a throwaway empty Mongo; every route renders per request, so no content is baked into the image.
# `:latest` moves only after the image boots.

on:
  push:
    branches: [main]
    paths-ignore: ['Docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongo:
        # 8.3+ refuses to start on kernels 6.19–7.0.13 (SERVER-121912); 8.2.12 matches local dev.
        image: mongo:8.2.12
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v5

      - name: Throwaway build secret
        run: |
          s="$(openssl rand -hex 32)"
          echo "::add-mask::$s"
          echo "BUILD_PAYLOAD_SECRET=$s" >> "$GITHUB_ENV"

      # Host network lets the build's RUN steps reach the service Mongo on 127.0.0.1.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          network: host
          allow: network.host
          build-args: NEXT_PUBLIC_SERVER_URL=${{ vars.PROD_SERVER_URL || 'https://sinaoshaghi.com' }}
          secrets: DATABASE_URL=mongodb://127.0.0.1:27017/portfolio-build
          secret-envs: PAYLOAD_SECRET=BUILD_PAYLOAD_SECRET
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL=mongodb://127.0.0.1:27017/portfolio-smoke \
            -e PAYLOAD_SECRET="$BUILD_PAYLOAD_SECRET" \
            "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 45); do
            curl -s -o /dev/null http://127.0.0.1:3000/admin && break
            sleep 2
          done
          fail=0
          for path in / /admin /work; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")"
            echo "$code $path"
            [ "$code" -ge 200 ] && [ "$code" -lt 500 ] || fail=1
          done
          [ "$fail" = 0 ] || { docker logs --tail 80 smoke; exit 1; }

      - name: Tag latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"
